<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>资产账本 · 功能预览</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="phone" id="phone">
    <div class="edge top"></div>
    <div class="notch"></div>

    <div class="statusbar">
      <span id="sb-time">9:41</span>
      <span class="sb-r">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="7" width="3" height="4" fill="currentColor"/><rect x="4.3" y="4.6" width="3" height="6.4" fill="currentColor"/><rect x="8.6" y="2.3" width="3" height="8.7" fill="currentColor"/><rect x="12.9" y="0" width="3" height="11" fill="currentColor"/></svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 3.4a9.5 9.5 0 0113 0M3.4 6a6 6 0 018.2 0"/><circle cx="7.5" cy="9" r="1" fill="currentColor" stroke="none"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.6" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="15" height="7" rx="1.4" fill="currentColor"/><rect x="22" y="3.6" width="1.6" height="3.8" rx="0.8" fill="currentColor" opacity=".45"/></svg>
      </span>
    </div>

    <main class="scroll" id="screen"></main>
    <div class="fade"></div>
    <nav class="tabbar" id="tabbar"></nav>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <div class="toast" id="toast"></div>

    <div class="edge bottom"></div>
  </div>

  <aside class="pnote">
    <b>功能预览</b>
    <span>· 点击底部「＋」记一笔支出，会从所选账户扣减余额</span><br />
    <span>· 「资产」页可增删改资产项（含实物照片）</span><br />
    <span>· 「统计」页切换本周 / 本月，删除记录会自动回滚余额</span><br />
    <span>· 「我的」页改汇率、换计价货币、清空 / 恢复数据</span><br />
    <span>· 数据存本地，刷新后仍在</span>
  </aside>

  <script src="lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
